name: Gnuplot figure smoke validation

on:
  pull_request:
    paths:
      - "scripts/gnuplot/**"
      - "scripts/generate_figures.sh"
      - "scripts/generate_figures.cmd"
      - "outputs/tables/**"
      - "FIGURE_STANDARD.md"
      - ".github/workflows/figure-smoke.yml"

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Gnuplot
        run: |
          sudo apt-get update
          sudo apt-get install -y gnuplot-nox fonts-urw-base35

      - name: Generate publication figures
        env:
          OUTPUT_MODES: "pdf png"
        run: bash scripts/generate_figures.sh

      - name: Verify figure artifacts
        run: |
          for figure in 2 3 4 5 6 7; do
            test -s "outputs/figures/Figure_${figure}.pdf"
            test -s "outputs/figures/Figure_${figure}.png"
          done
          test ! -e outputs/figures/Figure_1.pdf
          test ! -e outputs/figures/Figure_1.png
          test ! -d outputs/tables/figure_source
