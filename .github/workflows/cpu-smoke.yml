name: CPU smoke validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c(
            "dplyr", "tidyr", "purrr", "ggplot2", "readr", "stringr",
            "scales", "tibble", "forcats", "broom", "patchwork"
          ))'
          python3 -m pip install numpy cython setuptools

      - name: Check environment
        env:
          BENCHMARK_RUN_CUDA: "FALSE"
        run: Rscript scripts/00_check_environment.R

      - name: Run scientific validation
        env:
          RCS_SEED: "20260504"
        run: Rscript scripts/run_all.R

      - name: Run benchmark smoke test
        env:
          BENCHMARK_SMOKE: "TRUE"
          BENCHMARK_REPS: "2"
          BENCHMARK_BOOT_REPS: "200"
          BENCHMARK_MIN_SAMPLE_SEC: "0.10"
          BENCHMARK_WORKLOADS: "10000,50000"
          BENCHMARK_RUN_PYTHON: "TRUE"
          BENCHMARK_RUN_CUDA: "FALSE"
          BENCHMARK_PROCESS_WORKERS: "1,2"
          BENCHMARK_OPENMP_THREADS: "1,2"
          BENCHMARK_PRIMARY_WORKERS: "2"
          BENCHMARK_RESUME: "FALSE"
        run: Rscript scripts/run_benchmark.R

      - name: Verify required artifacts
        run: |
          test -f outputs/tables/Table_Property_Based_Checks.csv
          test -f outputs/tables/Table_Validation_Summary.csv
          test -f outputs/tables/Table_Threshold_Transition_Detail.csv
          test -f outputs/tables/Table_Threshold_Transition_Summary.csv
          test -f outputs/tables/Table_Weight_Perturbation_Sensitivity.csv
          test -f outputs/tables/Table_Weight_Perturbation_Summary.csv
          test -f outputs/tables/Table_Benchmark_Runtime_Raw.csv
          test -f outputs/tables/Table_Benchmark_Equivalence_Check.csv
          test -f outputs/tables/Table_Benchmark_Quality_Gates.csv
          test ! -d outputs/tables/figure_source
          test ! -d outputs/tables/supplementary
