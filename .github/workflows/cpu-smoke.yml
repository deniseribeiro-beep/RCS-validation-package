name: CPU smoke validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c(
            "dplyr", "tidyr", "purrr", "ggplot2", "readr", "stringr",
            "scales", "tibble", "forcats", "broom", "patchwork"
          ))'
          python3 -m pip install numpy cython setuptools

      - name: Check environment
        env:
          BENCHMARK_RUN_CUDA: "FALSE"
        run: Rscript scripts/00_check_environment.R

      - name: Verify checked-in threshold summary consistency
        run: |
          Rscript - <<'RS'
          detail <- read.csv("outputs/tables/Table_Threshold_Transition_Detail.csv", check.names = FALSE)
          summary <- read.csv("outputs/tables/Table_Threshold_Transition_Summary.csv", check.names = FALSE)
          groups <- split(detail, list(detail$matrix, detail$threshold_transition), drop = TRUE)
          expected <- do.call(rbind, lapply(groups, function(x) {
            data.frame(
              matrix = x$matrix[[1]],
              transition = gsub(" to ", "-to-", x$threshold_transition[[1]], fixed = TRUE),
              reached_n = sum(x$reached, na.rm = TRUE),
              total_n = nrow(x),
              stringsAsFactors = FALSE
            )
          }))
          expected$reached_fraction <- expected$reached_n / expected$total_n
          expected$reached <- paste0(expected$reached_n, "/", expected$total_n)
          key_expected <- paste(expected$matrix, expected$transition, sep = "|")
          key_summary <- paste(summary$matrix, summary$transition, sep = "|")
          idx <- match(key_expected, key_summary)
          if (anyNA(idx)) stop("Threshold summary is missing rows present in the detail table.")
          observed <- summary[idx, ]
          if (!all(observed$reached_n == expected$reached_n) ||
              !all(observed$total_n == expected$total_n) ||
              !all(abs(observed$reached_fraction - expected$reached_fraction) < 1e-12) ||
              !all(observed$reached == expected$reached)) {
            stop("Checked-in threshold summary is inconsistent with Table_Threshold_Transition_Detail.csv.")
          }
          RS

      - name: Run scientific validation
        env:
          RCS_SEED: "20260504"
        run: Rscript scripts/run_all.R

      - name: Run benchmark smoke test
        env:
          BENCHMARK_SMOKE: "TRUE"
          BENCHMARK_REPS: "2"
          BENCHMARK_BOOT_REPS: "200"
          BENCHMARK_MIN_SAMPLE_SEC: "0.10"
          BENCHMARK_WORKLOADS: "10000,50000"
          BENCHMARK_RUN_PYTHON: "TRUE"
          BENCHMARK_RUN_CUDA: "FALSE"
          BENCHMARK_PROCESS_WORKERS: "1,2"
          BENCHMARK_OPENMP_THREADS: "1,2"
          BENCHMARK_PRIMARY_WORKERS: "2"
          BENCHMARK_RESUME: "FALSE"
        run: Rscript scripts/run_benchmark.R

      - name: Verify required artifacts
        run: |
          test -f outputs/tables/Table_Property_Based_Checks.csv
          test -f outputs/tables/Table_Validation_Summary.csv
          test -f outputs/tables/Table_Threshold_Transition_Detail.csv
          test -f outputs/tables/Table_Threshold_Transition_Summary.csv
          test -f outputs/tables/Table_Weight_Perturbation_Sensitivity.csv
          test -f outputs/tables/Table_Weight_Perturbation_Summary.csv
          test -f outputs/tables/Table_Benchmark_Runtime_Raw.csv
          test -f outputs/tables/Table_Benchmark_Equivalence_Check.csv
          test -f outputs/tables/Table_Benchmark_Quality_Gates.csv
          test ! -d outputs/tables/figure_source
          test ! -d outputs/tables/supplementary
